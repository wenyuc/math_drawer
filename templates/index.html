<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>函数画图工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">MATH PLOTTER</p>
        <h1>函数画图工具</h1>
        <p>输入 LaTeX 数学表达式，生成二维函数图像或三维曲面。</p>
      </header>

      <section class="workspace" aria-label="函数绘图">
        <form id="plot-form" class="controls">
          <label for="mode">绘图类型</label>
          <select id="mode" name="mode">
            <option value="curve">二维曲线：y = f(x)</option>
            <option value="surface">三维曲面：z = f(x, y)</option>
            <option value="implicit">三维隐式曲面：F(x, y, z) = 0</option>
          </select>

          <label class="expression-control" for="expression">LaTeX 数学公式</label>
          <textarea class="expression-control" id="expression" name="expression" rows="3" maxlength="200"
            spellcheck="false" aria-describedby="formula-help"></textarea>
          <p id="formula-help" class="help expression-control">例如：\sin(x) 或 \frac{x^2-y^2}{5}</p>

          <section id="curve-function-editor" hidden aria-label="二维函数列表">
            <div id="curve-function-list"></div>
            <button id="add-function-button" class="secondary-button" type="button">添加函数</button>
            <p class="help">每个函数的 x 区间可单独设置；留空时使用默认区间 -10 到 10。</p>
          </section>

          <fieldset class="interval-controls" id="axis-interval-controls">
            <legend>变量区间</legend>
            <div class="variable-interval" data-variable="x">
              <label for="x-min">x</label>
              <input id="x-min" type="number" step="any" aria-label="x 区间下限">
              <span>到</span>
              <input id="x-max" type="number" step="any" aria-label="x 区间上限">
            </div>
            <div class="variable-interval" data-variable="y" hidden>
              <label for="y-min">y</label>
              <input id="y-min" type="number" step="any" aria-label="y 区间下限">
              <span>到</span>
              <input id="y-max" type="number" step="any" aria-label="y 区间上限">
            </div>
            <div class="variable-interval" data-variable="z" hidden>
              <label for="z-min">z</label>
              <input id="z-min" type="number" step="any" aria-label="z 区间下限">
              <span>到</span>
              <input id="z-max" type="number" step="any" aria-label="z 区间上限">
            </div>
          </fieldset>

          <button id="submit-button" type="submit">绘制函数</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <div class="plot-area">
          <div id="placeholder" class="placeholder">
            <span aria-hidden="true">⌁</span>
            <p>函数图像将在这里显示</p>
          </div>
          <img id="plot-image" alt="函数绘图结果" hidden>
          <div class="axis-controls" role="group" aria-label="调整坐标轴缩放">
            <button type="button" data-axis="y" data-zoom="in"
              aria-label="放大 y 轴间距" title="放大 y 轴间距" disabled>↑</button>
            <button type="button" data-axis="x" data-zoom="in"
              aria-label="放大 x 轴间距" title="放大 x 轴间距" disabled>←</button>
            <span aria-hidden="true"></span>
            <button type="button" data-axis="x" data-zoom="out"
              aria-label="缩小 x 轴间距" title="缩小 x 轴间距" disabled>→</button>
            <button type="button" data-axis="y" data-zoom="out"
              aria-label="缩小 y 轴间距" title="缩小 y 轴间距" disabled>↓</button>
          </div>
        </div>
      </section>
      <footer>公式由本地 Python 服务计算与绘制，二维曲线最多支持 4 个函数；每个函数可单独设置 x 区间，留空时默认使用 -10 到 10。三维坐标默认范围为 -5 到 5。</footer>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
